name: CI CD en la nube

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: redes2web-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Construir probar y publicar
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build Docker Image
        run: docker build -t elzimio/redes2web:flaskv2 .

      - name: Test Flask application
        run: |
          docker run --rm elzimio/redes2web:flaskv2 python -c \
            "from main import app; r = app.test_client().get('/'); assert r.status_code == 200; assert r.data == b'pagina de prueba'; print('Flask OK: HTTP 200')"

      - name: Docker Login
        if: github.event_name != 'pull_request'
        env:
          DOCKER_USER: ${{ secrets.DOCKER_USER }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
        run: printf '%s' "$DOCKER_PASSWORD" | docker login -u "$DOCKER_USER" --password-stdin

      - name: Push Docker Image
        if: github.event_name != 'pull_request'
        run: docker push elzimio/redes2web:flaskv2

      - name: Exportar respuesta Flask para GitHub Pages
        if: github.event_name != 'pull_request'
        run: |
          mkdir -p _site
          docker run --rm elzimio/redes2web:flaskv2 python -c \
            "from main import app; r = app.test_client().get('/'); assert r.status_code == 200; print(r.get_data(as_text=True), end='')" > _site/index.html
          printf '%s' "$GITHUB_SHA" > _site/version.txt

      - name: Subir sitio verificado
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    name: Desplegar en GitHub Pages
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar sitio en la nube
        id: deployment
        uses: actions/deploy-pages@v4

  verify:
    name: Verificar sitio publico
    needs: deploy
    runs-on: ubuntu-24.04
    env:
      SITE_URL: ${{ needs.deploy.outputs.page_url }}
    steps:
      - name: Comprobar HTTP contenido y version desplegada
        run: |
          for attempt in $(seq 1 24); do
            status=$(curl -sS -o /tmp/page.html -w '%{http_code}' "$SITE_URL" || true)
            version=$(curl -fsS "${SITE_URL}version.txt?sha=${GITHUB_SHA}" || true)
            if [ "$status" = 200 ] && [ "$(cat /tmp/page.html)" = 'pagina de prueba' ] && [ "$version" = "$GITHUB_SHA" ]; then
              echo "Sitio publico OK: HTTP 200"
              echo "Contenido OK: pagina de prueba"
              echo "Version desplegada: $version"
              echo "URL: $SITE_URL"
              exit 0
            fi
            sleep 5
          done
          echo 'No se pudo verificar el despliegue publicado'
          exit 1
